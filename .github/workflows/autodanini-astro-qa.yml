name: AutoDanini Astro QA (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/danini-advisor-client.js'
      - 'tests/b2b/autodanini-home-qa.test.mjs'
      - 'tests/b2b/autodanini-browser-qa.mjs'
      - '.github/workflows/autodanini-astro-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  astro-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check PR207 client JavaScript
        run: node --check public/danini-advisor-client.js
      - name: Static integration contract (SR/DE)
        run: node --test tests/b2b/autodanini-home-qa.test.mjs
      - name: Astro type and template checks
        run: npm run check:b2b
      - name: Build Astro SR/DE static pages
        run: npm run build:b2b
      - name: Install isolated browser for visual QA
        run: npx playwright install chromium --with-deps
      - name: Browser E2E and responsive screenshots (SR/DE)
        run: |
          npm run dev:b2b -- --port 4321 > /tmp/autodanini-astro-preview.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4321/de/ > /dev/null; then break; fi
            sleep 2
          done
          node tests/b2b/autodanini-browser-qa.mjs
      - name: Upload SR/DE desktop and mobile screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodanini-pr208-responsive-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 7
