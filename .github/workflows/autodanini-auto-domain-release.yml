name: Isolated AutoDanini auto-domain release
on:
  pull_request:
    branches: [main]
    paths:
      - 'server.js'
      - 'package.json'
      - 'scripts/build-autodanini-auto-release.cjs'
      - 'autodanini/staging-v12/**'
      - 'tests/test-autodanini-domain-release.cjs'
      - '.github/workflows/autodanini-auto-domain-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing server dependencies
        run: npm ci --no-audit --no-fund
      - name: Build existing DANINI and new AutoDanini from public feature branch
        run: npm run build
      - name: Check host isolation, disabled payments and private API
        run: node --test tests/test-autodanini-domain-release.cjs
      - name: Validate legacy public site, original image and auto images
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          if(!fs.existsSync('dist/index.html'))throw new Error('Legacy DANINI website build missing');
          for(const f of ['index','admin','auctions','buyers','dealers','live']){
            if(!fs.existsSync('autodanini-auto-dist/'+f+'.html'))throw new Error('AutoDanini page missing: '+f);
          }
          for(const f of ['danini-auto-uvoz.webp','danini-pregled-auta.webp']){
            if(!fs.existsSync('autodanini-auto-dist/'+f))throw new Error('AutoDanini original photo missing: '+f);
          }
          for (const name of ['dragan-original-portrait.jpg','dragan-business-grid-ai.png']){
            const photo='autodanini-auto-dist/'+name;
            if(!fs.existsSync(photo) || fs.statSync(photo).size < 100000) throw new Error('Missing real business photo: '+name);
          }
          const index=fs.readFileSync('autodanini-auto-dist/index.html','utf8');
          const about=fs.readFileSync('autodanini-auto-dist/about.html','utf8');
          const buyers=fs.readFileSync('autodanini-auto-dist/buyers.html','utf8');
          const dealers=fs.readFileSync('autodanini-auto-dist/dealers.html','utf8');
          if(index.includes('images.unsplash.com')||about.includes('images.unsplash.com'))throw new Error('Remote stock imagery still used');
          if(!about.includes('dragan-business-grid-ai.png'))throw new Error('Business grid not displayed');
          const contact=fs.readFileSync('autodanini-auto-dist/contact.html','utf8');
          for(const [name,page,photo] of [
            ['index',index,'dragan-business-grid-ai.png'],
            ['about',about,'dragan-business-grid-ai.png'],
            ['contact',contact,'dragan-original-portrait.jpg']
          ]){
            if(!page.includes('style="--image:url(\\\'./'+photo+'\\\')"'))throw new Error('Wrong business hero image on '+name);
            if(!page.includes('content="https://auto.daninihub.com/dragan-original-portrait.jpg"'))
              throw new Error('Social business photo replaced with car on '+name);
          }
          const businessPhotos=['dragan-original-portrait.jpg','dragan-business-grid-ai.png'];
          const signatures=['ffd8ff','89504e470d0a1a0a'];
          for(let i=0;i<businessPhotos.length;i++){
            const content=fs.readFileSync('autodanini-auto-dist/'+businessPhotos[i]);
            if(!content.subarray(0,signatures[i].length/2).toString('hex').startsWith(signatures[i]))
              throw new Error('Business image wrong format: '+businessPhotos[i]);
          }
          if(!index.includes('owner-note')||!buyers.includes('name="listing3"')||!dealers.includes('name="listing3"'))throw new Error('Owner proof or RFQ criteria missing');
          console.log('Owner photo, AI-labeled business grid, local imagery and detailed buyer/dealer RFQ: OK');
          console.log('Both site builds and original imagery verified');
          NODE
