name: Refresh AutoDanini audited dependency lock
on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/autodanini-dependency-lock-refresh.yml'
permissions:
  contents: write
jobs:
  lock-refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/autodanini-live-photo-security-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lock for audited production versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify npm ci and check patched dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=critical
      - name: Commit updated lock only on trusted branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(lock): resolve audited mysql2 proxy-addr qs versions"
            git push origin HEAD:${{ github.head_ref }}
          fi
