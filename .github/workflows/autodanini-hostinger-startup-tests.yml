name: AutoDanini Hostinger startup regression tests
on:
  pull_request:
    paths:
      - 'server.js'
      - 'core/hostinger-release-readiness.js'
      - 'core/autodanini-auth-security.js'
      - 'core/autodanini-customer-auth.js'
      - 'core/autodanini-mail-policy.js'
      - 'tests/test-autodanini-mail-policy.cjs'
      - 'tests/test-autodanini-auth-security.cjs'
      - 'tests/test-autodanini-customer-auth.cjs'
      - 'tests/test-hostinger-release-readiness.cjs'
      - '.github/workflows/autodanini-hostinger-startup-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies for HTTP tests
        run: npm ci --no-audit --no-fund
      - name: Test fail-closed startup rules
        run: node --test tests/test-hostinger-release-readiness.cjs
      - name: Validate mail sender policy and customer support reply-to
        run: node --test tests/test-autodanini-mail-policy.cjs
      - name: Test OTP, CSRF origin and session token rules
        run: node --test tests/test-autodanini-auth-security.cjs
      - name: Verify customer login, session and record isolation
        run: node --test tests/test-autodanini-customer-auth.cjs
      - name: Check syntax of updated server code
        run: |
          node --check server.js
          node --check core/hostinger-release-readiness.js
          node --check core/autodanini-auth-security.js
          node --check core/autodanini-customer-auth.js
          node --check core/autodanini-mail-policy.js
      - name: Regression checks against the existing Hostinger code
        run: |
          npm run build
