name: AutoDanini preflight (no deployment)
on:
  pull_request:
    paths:
      - 'autodanini/appdeploy-admin/**'
      - '.github/workflows/autodanini-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify admin extension safeguards (no AppDeploy usage)
        run: node autodanini/appdeploy-admin/scripts/check-source.mjs
