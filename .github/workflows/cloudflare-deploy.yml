name: DANINI Cloudflare production deploy (guarded)
on:
  workflow_dispatch:
  # Approved guarded release for assistant requests and persistent AutoDanini receipts.
  # Owner approval 2026-11-23: guarded release PR #292 no-JS privacy fix, all five CI suites PASS.
  # P0 2026-11-23: approved PR #291 AutoDanini contact fallback and DE/SR browser E2E, guarded release.
  # 2026-11-23 owner-approved P0 release after PR #290: modern navigation and Business contact fallback.
  # Explicit guarded release: a workflow-file change triggers this same checked deploy.
  # Authorized DANINI knowledge-centre release after PR #237 QA, 2026-11-17.
  # Authorized evergreen and official-logo release: PR #238, validated Chromium QA.
  # Other source-code merges remain manual; no continuous automatic deployments.
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-deploy.yml'
permissions:
  contents: read
concurrency:
  group: danini-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c7c8ad399f1e851d1c3a8be34e66f822
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require deployment credentials
        id: credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN GitHub secret; no deployment performed'; exit 1; }
      - name: Install locked dependencies and build actual Cloudflare assets
        id: build
        run: |
          npm ci --no-audit --no-fund
          npm run build:platform
          node scripts/test-danini-education.cjs
          npm run check:b2b
          node --test tests/b2b/autodanini-home-qa.test.mjs
          node --test tests/b2b/ai-intake.test.mjs tests/b2b/ai-preview.test.mjs
          test -f dist/de/ai-savetnik/index.html
          test -f dist/sr/ai-savetnik/index.html
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const locales = [
            ['de','Auto in Deutschland gefunden?','Auto in Deutschland gefunden? Erst prüfen, dann reisen.'],
            ['sr','Našao si auto u Nemačkoj?','Našao si auto u Nemačkoj? Proveri oglas pre puta i kapare.']
          ];
          for (const [locale,heading,brandHeading] of locales) {
            const home=fs.readFileSync('dist/'+locale+'/auto-check/index.html','utf8');
            const brand=fs.readFileSync('dist/'+locale+'/index.html','utf8');
            const business=fs.readFileSync('dist/'+locale+'/business/index.html','utf8');
            const advisor=fs.readFileSync('dist/'+locale+'/ai-savetnik/index.html','utf8');
            assert.ok(brand.includes(brandHeading),'DANINI two-line brand Hero missing in '+locale);
            assert.ok(brand.includes('d-visual-service'),'DANINI visual service paths missing in '+locale);
            const academy=fs.readFileSync('dist/'+locale+'/akademija/index.html','utf8');
            assert.ok(brand.includes('/'+locale+'/akademija/'),'Academy homepage CTA missing in '+locale);
            assert.ok(academy.includes('data-education-print'),'Academy worksheet missing in '+locale);
            assert.ok(brand.includes('d-card-media'),'DANINI service card visuals missing in '+locale);
            assert.ok(business.includes('DANINI Anfragebüro'),'DANINI Business offer missing in '+locale);
            assert.ok(home.includes(heading),'AutoDanini Hero missing in '+locale);
            assert.ok(home.includes('universal-advisor-form'),'Vehicle input missing in '+locale);
            assert.ok(advisor.includes('id="listing"'),'Advisor input missing in '+locale);
            assert.ok(advisor.includes('data-question'),'Advisor questions missing in '+locale);
          }
          console.log('PASS: built SR/DE DANINI brand, business and preserved AutoDanini HTML');
          NODE
      - name: Preserve current non-secret production bindings
        id: bindings
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          config.assets.directory='./dist'; // Publish the merged Astro + preserved AutoDanini asset bundle.
          // Cloudflare account metadata was independently checked against this repository's
          // production config on 2026-11-15. GitHub deploy token needs write, not
          // additional Workers Scripts Settings read permission (HTTP 400 / 9106).
          const prod=JSON.parse(fs.readFileSync('wrangler.b2b-production.jsonc','utf8'));
          // Use the existing integrated Worker entrypoint: it exports IntakeWorkflow,
          // routes B2B/portal endpoints, and delegates legacy AutoDanini/Brevo APIs.
          config.main=prod.main;
          // Workers AI binding must be part of the actual integrated production Worker.
          // It does not enable inference; runtime gates remain disabled until authorized.
          assert.equal(prod.ai?.binding,'AI','Canonical production config missing Workers AI binding; abort');
          assert.equal(prod.vars?.AI_ENABLED,'true','Canonical production AI_ENABLED must remain approved true; abort');
          assert.equal(prod.vars?.DANINI_AI_LIVE_APPROVED,'true','Canonical production approval gate missing; abort');
          config.ai=prod.ai;
          assert.equal(prod.browser?.binding,'BROWSER','Canonical Browser Rendering binding missing; abort');
          config.browser=prod.browser;
          assert.equal(config.browser.binding,'BROWSER','Browser Rendering binding not preserved; abort');
          assert.equal(config.ai.binding,'AI','Workers AI binding missing; abort');
          config.assets.run_worker_first=prod.assets.run_worker_first;
          assert.equal(config.name,prod.name,'Worker name mismatch; abort');
          for (const route of ['/api/*','/portal','/portal/*','/','/de*','/sr*','/auto*','/_astro/*','/_danini/*']) {
            assert.ok(config.assets.run_worker_first.includes(route),'Required Worker-first route missing: '+route);
          }
          assert.equal(prod.vars.ACCESS_TEAM_DOMAIN,'https://danininet.cloudflareaccess.com','Access issuer mismatch; abort');
          assert.equal(prod.vars.ACCESS_AUD,'202a450ca6a61daca3012f0472cb24f4461a69df9693904ee288e76211f244d6','Production owner Access audience mismatch; abort');
          assert.equal(prod.vars.DIRECTOR_EMAIL,'dragangaganet@gmail.com','Owner allowlist mismatch; abort');
          assert.equal(config.main,'src/index.ts','Incorrect integrated entrypoint; abort');
          assert.equal(config.d1_databases[0].database_id,prod.d1_databases[0].database_id,'D1 mismatch; abort');
          assert.equal(prod.d1_databases[0].database_id,'9c3fc741-5cb0-432f-82ca-c75e8220c435','Unexpected D1 target; abort');
          assert.equal(prod.kv_namespaces[0].id,'b87637aaa2c24b1281a8bd86ca86525d','Unexpected KV target; abort');
          assert.equal(prod.r2_buckets[0].bucket_name,'danini-b2b-private','Unexpected R2 target; abort');
          assert.equal(prod.workflows[0].name,'danini-intake-production','Unexpected Workflow target; abort');
          config.r2_buckets=prod.r2_buckets;
          config.kv_namespaces=prod.kv_namespaces;
          config.workflows=prod.workflows;
          config.keep_vars=true;
          // Owner confirmed Workers Free (2026-11-17); free Workers AI quota has no paid overages.
          // Keep all existing non-AI vars and bindings while enabling the approved inference path.
          config.vars={...prod.vars};
          assert.equal(config.ai.binding,'AI','AI binding required for live inference');
          assert.equal(config.vars.AI_ENABLED,'true','AI gate disabled in GENERATED production config');
          assert.equal(config.vars.DANINI_AI_LIVE_APPROVED,'true','AI approval gate disabled in GENERATED production config');
          for(const binding of ['DANINI_DB','PARTNERS','DOCUMENTS','INTAKE_WORKFLOW']){
            const entries=[...(config.d1_databases||[]),...(config.kv_namespaces||[]),...(config.r2_buckets||[]),...(config.workflows||[])];
            assert.ok(entries.some(x=>x.binding===binding),'Missing '+binding+' in GENERATED production config');
          }
          const names=['BREVO_API_KEY','DANINI_CONTACT_ACTIVE','DANINI_TURNSTILE_SECRET','DANINI_TURNSTILE_SITEKEY','DANINI_NOTIFY_TO','DANINI_BREVO_SENDER'];
          config.secrets={required:names};
          fs.writeFileSync('wrangler.production-ci.jsonc',JSON.stringify(config,null,2)+'\n');
          console.log('PASS: checked production config IDs and required secret declarations; existing live binding names previously verified; no secret values logged');
          NODE
      - name: Deploy complete production Worker and static assets
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: c7c8ad399f1e851d1c3a8be34e66f822
          command: deploy --config wrangler.production-ci.jsonc --keep-vars
      - name: Verify deployed bilingual advisor, public sitekey and API
        id: verify
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://daninihub.com';
          for(const path of ['/de/ai-savetnik/','/sr/ai-savetnik/']){
            const r=await fetch(base+path,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200,path+' HTTP status');
            const html=await r.text();
            assert.equal((html.match(/data-question=/g)||[]).length,3,path+' questions');
            assert.match(html,/advisor-turnstile/,path+' Turnstile container');
            assert.match(html,/danini-advisor-client\.js/,path+' advisor client script');
            console.log('PASS',path,'HTTP 200');
          }
          for (const [path,heading] of [['/de/','Auto in Deutschland gefunden? Erst prüfen, dann reisen.'],['/sr/','Našao si auto u Nemačkoj? Proveri oglas pre puta i kapare.']]){
            const r=await fetch(base+path,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200,path+' HTTP status');
            const html=await r.text();
            assert.ok(html.includes(heading),path+' DANINI brand page not live');
            const locale=path==='/de/'?'de':'sr';
            assert.ok(html.includes('href="/'+locale+'/akademija/"'),path+' Academy CTA not live');
            assert.ok(html.includes('href="/'+locale+'/business/#anfrage"'),path+' missing Business inquiry CTA');
            assert.ok(html.includes('href="/'+locale+'/auto-check/#contact"'),path+' missing AutoDanini inquiry CTA');
            assert.ok(html.includes('mailto:info@daninihub.com'),path+' missing direct email fallback');
            console.log('PASS',path,'Business + AutoDanini conversion CTAs and email fallback');
          }
          for (const [path,heading] of [['/de/auto-check/','Auto in Deutschland gefunden?'],['/sr/auto-check/','Našao si auto u Nemačkoj?']]){
            const r=await fetch(base+path,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200,path+' HTTP status');
            const html=await r.text();
            assert.ok(html.includes(heading),path+' AutoDanini hero not live');
            assert.ok(html.includes('universal-advisor-form'),path+' vehicle input missing');
          }
          // Module 02 and free educational assets (no customer data or payment requests).
          for(const locale of ['de','sr']){
            const lessonPath='/'+locale+'/akademija/modul-02/';
            const lesson=await fetch(base+lessonPath,{signal:AbortSignal.timeout(20000)});
            assert.equal(lesson.status,200,lessonPath+' must be served');
            const html=await lesson.text();
            assert.ok(html.includes('https://daninihub.com'+lessonPath),lessonPath+' canonical missing');
            assert.ok(html.includes('data-lesson-print'),lessonPath+' printable worksheet missing');
            assert.ok(!html.includes('noindex,follow'),lessonPath+' still noindex');
            const academy=await fetch(base+'/'+locale+'/akademija/',{signal:AbortSignal.timeout(20000)});
            assert.equal(academy.status,200);
            const academyHtml=await academy.text();
            assert.ok(academyHtml.includes('href="'+lessonPath+'"'),lessonPath+' navigation missing');
          }
          for(const file of ['danini-starter-kit-recherche.csv','danini-starter-kit-offer-de-sr.md','danini-starter-kit-checklist-de-sr.md']){
            const response=await fetch(base+'/downloads/akademija/'+file,{signal:AbortSignal.timeout(20000)});
            assert.equal(response.status,200,'Free Academy download missing: '+file);
            const content=await response.text();
            assert.ok(content.length>100,'Empty Academy download: '+file);
          }
          console.log('PASS public DE/SR Module 02 plus three Starter Kit downloads');
          const resp=await fetch(base+'/api/lead/status',{signal:AbortSignal.timeout(20000)});
          assert.equal(resp.status,200);
          const status=await resp.json();
          assert.equal(status.enabled,true);
          assert.equal(status.channel,'brevo');
          assert.equal(status.turnstileSiteKey,'0x4AAAAAAF5ySODGLwgzvV0n');
          const js=await fetch(base+'/danini-advisor-client.js',{signal:AbortSignal.timeout(20000)});
          assert.equal(js.status,200);
          assert.match(await js.text(),/challenges\.cloudflare\.com\/turnstile/);
          // Test both the exact portal and private subpaths through Cloudflare Access.
          // Intentionally unauthenticated, without sensitive cookies or customer data.
          for(const path of ['/portal','/portal/','/portal/cases',
            '/portal/case/00000000-0000-0000-0000-000000000000']){
            const response=await fetch(base+path,{redirect:'manual',signal:AbortSignal.timeout(15000)});
            assert.ok([302,401,403].includes(response.status),path+' exposed without Access: HTTP '+response.status);
            const location=response.headers.get('location')||'';
            if(response.status===302)assert.ok(location.includes('cloudflareaccess.com')||location.includes('/cdn-cgi/access/'),path+' login redirect missing');
            const body=await response.text();
            assert.ok(!body.includes('Pregled poslovnih zahteva'),path+' private portal HTML leaked');
            assert.ok(!body.includes('"cases"'),path+' private case data leaked');
            console.log('PASS Access blocks',path,response.status);
          }
          console.log('PASS production Turnstile and Brevo readiness; no customer email sent');
          NODE
      - name: Verify published free Builder and active public catalog (DE/SR)
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          for (const lang of ['de','sr']) {
            const root='https://daninihub.com/'+lang;
            const pages={};
            for (const [key,path] of Object.entries({builder:'/akademija/builder/',home:'/',academy:'/akademija/',catalog:'/wissen/produkte/'})) {
              const response=await fetch(root+path+'?qa=20261123-live',{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)});
              assert.equal(response.status,200,lang+' '+key+' HTTP status');
              pages[key]=await response.text();
            }
            const b=pages.builder,h=pages.home,a=pages.academy,p=pages.catalog;
            assert.ok(b.includes(lang==='de'?'Kostenloser Online Business Builder':'Besplatni Online Business Builder'),lang+' free Builder title missing');
            assert.ok(!b.includes('Noch nicht öffentlich freigeschaltet')&&!b.includes('Još nije javno aktiviran'),lang+' stale pilot metadata still public');
            assert.ok(!b.includes('noindex,follow'),lang+' free Builder incorrectly noindex');
            assert.ok(b.includes('/js/academy-builder.js')&&b.includes('id="demo-export"'),lang+' usable free Builder missing');
            assert.ok(h.includes('/'+lang+'/akademija/builder/'),lang+' home CTA missing');
            assert.ok(a.includes('/'+lang+'/akademija/builder/'),lang+' academy CTA missing');
            assert.ok(p.includes('/'+lang+'/akademija/builder/'),lang+' products CTA missing');
            assert.ok(!p.includes('Javna prodaja isključena')&&!p.includes('Öffentlicher Verkauf deaktiviert'),lang+' unavailable paid catalog still shown');
            console.log('PASS LIVE '+lang+' free Builder, active home/academy/catalog, no stale disabled label');
          }
          NODE


      - name: Academy AI controlled Free-plan go-live status and negative-requests QA
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const root='https://daninihub.com';
          const timeout=()=>AbortSignal.timeout(18000);
          const check=await fetch(root+'/api/academy/ai/status',{headers:{'cache-control':'no-cache'},signal:timeout()});
          assert.equal(check.status,200,'Academy AI status must be public and reachable');
          const state=await check.json();
          assert.equal(state.enabled,true,'Owner-approved Academy AI remains disabled on production');
          assert.equal(typeof state.siteKey,'string');
          assert.ok(state.siteKey.startsWith('0x'),'Academy Turnstile sitekey missing');
          for(const lang of ['de','sr']){
            const page=await fetch(root+'/'+lang+'/akademija/builder/',{signal:timeout()});
            assert.equal(page.status,200,'Builder not publicly available: '+lang);
            const html=await page.text();
            assert.ok(html.includes('demo-ai-review')&&html.includes('demo-ai-turnstile'),'Academy AI controls absent: '+lang);
          }
          const blocked=await fetch(root+'/api/academy/ai/review',{
            method:'POST',headers:{origin:'https://invalid.example','content-type':'application/json'},
            body:JSON.stringify({language:'sr',step:'niche',projectName:'Test',fields:{a:'Any field'},turnstileToken:'INVALID_TEST_TOKEN'}),
            signal:timeout()
          });
          assert.equal(blocked.status,403,'Invalid origin was not rejected before inference');
          assert.equal((await blocked.json()).error,'invalid_origin');
          const wrong=await fetch(root+'/api/academy/ai/review',{method:'GET',signal:timeout()});
          assert.equal(wrong.status,405,'Review must not run on GET');
          console.log('PASS Academy AI LIVE enabled DE/SR, Turnstile sitekey, invalid-origin rejection, no inference performed');
          NODE

      - name: Verify deployed DE/SR site helper, Free gating and safe origin rejection
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin='https://daninihub.com';
          const request=(path,options={})=>fetch(origin+path,{signal:AbortSignal.timeout(16000),headers:{'cache-control':'no-cache',...(options.headers||{})},...options});
          const status=await request('/api/assistant/status');
          assert.equal(status.status,200,'Site assistant status missing');
          const state=await status.json();
          assert.equal(state.enabled,true,'Site assistant is disabled after deploy');
          assert.equal(typeof state.siteKey,'string');
          for(const locale of ['de','sr']){
            for(const page of ['/','/akademija/builder/','/business/','/auto-check/']){
              let observed=false,diagnostic='';
              // Cloudflare static-asset propagation can lag behind Worker deploy.
              // Probe a cache-busted URL, without weakening the live acceptance gate.
              for(let attempt=0;attempt<8;attempt++){
                const res=await request('/'+locale+page+'?release=assistant-retry-285-'+attempt);
                assert.equal(res.status,200,'Missing page '+locale+page);
                const html=await res.text();
                const toggle=html.includes('danini-assistant-toggle'),panel=html.includes('danini-assistant-panel'),retry=html.includes('danini-assistant-retry');
                diagnostic=JSON.stringify({locale,page,attempt,toggle,panel,retry,cache:res.headers.get('cf-cache-status'),etag:res.headers.get('etag')});
                if(toggle&&panel&&retry){observed=true;break}
                await new Promise(resolve=>setTimeout(resolve,1500));
              }
              assert.ok(observed,'Assistant help/retry missing on live page: '+diagnostic);
            }
          }
          const script=await request('/js/danini-site-assistant.js');
          assert.equal(script.status,200,'Assistant browser script missing');
          const scriptContent=await script.text();
          assert.ok(scriptContent.includes('danini-assistant-ask'));
          assert.ok(scriptContent.includes('danini-assistant-retry')&&scriptContent.includes('AI servis je trenutno isključen'),'Assistant retry/status fix not live');
          const bad=await request('/api/assistant/ask',{method:'POST',headers:{origin:'https://invalid.example','content-type':'application/json'},
            body:JSON.stringify({language:'sr',context:'academy',field:'Idea',question:'How to complete this?',turnstileToken:'INVALID_TEST_TOKEN_001'})});
          assert.equal(bad.status,403,'Invalid origin was not rejected before AI call');
          assert.equal((await bad.json()).error,'invalid_origin');
          const wrong=await request('/api/assistant/ask',{method:'GET'});
          assert.equal(wrong.status,405);
          console.log('PASS public DE/SR DANINI context helper; no AI inference, no form data or third-party messages');
          NODE

      - name: Verify Turnstile CSP and individual DANINI AI coaching on live DE/SR
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://daninihub.com';
          for(const locale of ['de','sr']){
            const res=await fetch(base+'/'+locale+'/akademija/builder/?qa=csp-coach-289',{signal:AbortSignal.timeout(16000),headers:{'cache-control':'no-cache'}});
            assert.equal(res.status,200);
            const csp=res.headers.get('content-security-policy')||'';
            assert.ok(/connect-src[^;]*https:\/\/challenges\.cloudflare\.com/.test(csp),'Turnstile connect-src not in live '+locale+' CSP: '+csp.slice(0,250));
            assert.ok(/script-src[^;]*https:\/\/challenges\.cloudflare\.com/.test(csp),'Turnstile script-src missing: '+locale);
            assert.ok(/frame-src[^;]*https:\/\/challenges\.cloudflare\.com/.test(csp),'Turnstile frame-src missing: '+locale);
            const html=await res.text();
            assert.ok(html.includes('danini-assistant-project')&&html.includes('danini-assistant-history'),'AI coach/project controls absent on live '+locale);
          }
          const js=await fetch(base+'/js/danini-site-assistant.js?qa=coach-289',{signal:AbortSignal.timeout(16000),cache:'no-store'});
          assert.equal(js.status,200);
          const script=await js.text();
          assert.ok(script.includes('conversation.slice(-4)')&&script.includes('/api/assistant/projects'),'Independent project coach client not deployed');
          const state=await fetch(base+'/api/assistant/status',{signal:AbortSignal.timeout(16000),cache:'no-store'});
          assert.equal(state.status,200);
          assert.equal((await state.json()).enabled,true,'Site AI is off on production');
          const unauth=await fetch(base+'/api/assistant/projects',{signal:AbortSignal.timeout(16000),cache:'no-store'});
          assert.equal(unauth.status,200);
          const p=await unauth.json();
          assert.equal(p.authenticated,false,'Project listing unexpectedly requires no authentication');
          assert.deepEqual(p.projects,[],'Unauthenticated projects must never leak');
          const bad=await fetch(base+'/api/assistant/ask',{method:'POST',signal:AbortSignal.timeout(16000),
            headers:{origin:'https://untrusted.example','content-type':'application/json'},
            body:JSON.stringify({language:'sr',context:'general',field:'',question:'Kako da pokrenem online biznis?',turnstileToken:'INVALID_TEST_ONLY'})});
          assert.equal(bad.status,403,'Invalid origin request not rejected');
          console.log('PASS live Turnstile connect-src DE/SR, 1:1 AI coaching controls, private projects and origin protections');
          NODE

      - name: Verify Academy FREE guest remains public and customer auth fails closed without secrets
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin='https://daninihub.com';
          const cfg=await fetch(origin+'/api/academy/config',{signal:AbortSignal.timeout(16000),cache:'no-store'});
          assert.equal(cfg.status,200,'Owner-invited Academy login must be configured (check signing-secret length and invite list)');
          if(cfg.status===200){
            const body=await cfg.json();
            assert.equal(body.enabled,true,'Unexpected enabled Academy config');
            assert.equal(typeof body.siteKey,'string','Invited Academy must retain Turnstile site key');
            assert.ok(body.siteKey.length>=7,'Invited Academy requires a nonempty site key');
          }
          for(const lang of ['de','sr']){
            const res=await fetch(origin+'/'+lang+'/akademija/builder/',{signal:AbortSignal.timeout(16000),cache:'no-store'});
            assert.equal(res.status,200);
            const html=await res.text();
            assert.ok(html.includes('id="demo"')&&html.includes('id="dashboard"')&&html.includes('id="delete-account"'),'Free Builder or customer pilot UI missing: '+lang);
            assert.ok(html.includes('href="#signin"')&&html.includes('id="pilot-login-status"')&&html.includes('id="pilot-login-retry"'),'Visible invited FREE login not published: '+lang);
          const academyScript=await fetch(origin+'/js/academy-builder.js?release=turnstile-otp-288',{signal:AbortSignal.timeout(16000),cache:'no-store'});
          assert.equal(academyScript.status,200,'Academy JS unavailable');
          const academyCode=await academyScript.text();
          assert.ok(academyCode.includes('turnstileScriptPromise')&&academyCode.includes('turnstile_script_blocked')&&academyCode.includes('Cloudflare bezbednosna provera nije učitana'),'Fixed shared Turnstile loader not publicly deployed');

          }
          const denied=await fetch(origin+'/api/academy/auth/start',{method:'POST',headers:{origin,'content-type':'application/json'},
             body:JSON.stringify({email:'not-invited@example.invalid',language:'sr',turnstileToken:'INVALID-TEST-ONLY'}),
