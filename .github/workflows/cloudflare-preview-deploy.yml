name: DANINI Cloudflare preview deployment

on:
  push:
    branches: [cloudflare-danini-auto-preview-20261102]
    paths:
      - '.github/workflows/cloudflare-preview-deploy.yml'
      - 'scripts/deploy-cloudflare-preview.cjs'
      - 'scripts/test-cloudflare-deploy-safety.cjs'
      - 'scripts/build-cloudflare-preview.cjs'
      - 'scripts/test-cloudflare-preview.cjs'
      - 'server-public-runtime.js'
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: danini-cloudflare-pr95-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.repository == 'danininet/daninihub' && github.ref == 'refs/heads/cloudflare-danini-auto-preview-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify preview deployment safeguards
        run: node --test scripts/test-cloudflare-deploy-safety.cjs
      - name: Check Cloudflare connection without exposing credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-cloudflare-preview.cjs check
      - name: Install and build the existing PR 95 preview
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/build-cloudflare-preview.cjs
          node scripts/test-cloudflare-preview.cjs
      - name: Publish only the isolated pages.dev preview and verify it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/deploy-cloudflare-preview.cjs deploy
