name: DANINI Cloudflare preview QA
on:
  pull_request:
    paths:
      - 'scripts/build-cloudflare-preview.cjs'
      - 'scripts/test-cloudflare-preview.cjs'
      - 'server-public-runtime.js'
      - '.github/workflows/cloudflare-preview-qa.yml'
  workflow_dispatch:
jobs:
  static-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/build-cloudflare-preview.cjs
      - run: node scripts/test-cloudflare-preview.cjs
