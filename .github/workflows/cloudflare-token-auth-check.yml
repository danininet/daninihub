name: Cloudflare API token authentication check (no deploy)

on:
  push:
    branches:
      - fix/p0-cloudflare-token-auth-check-20261116
    paths:
      - '.github/workflows/cloudflare-token-auth-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-token:
    name: Verify GitHub Cloudflare API token (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Cloudflare API token without exposing it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          if (!token) {
            console.error('FAIL: CLOUDFLARE_API_TOKEN secret is missing or empty.');
            process.exit(1);
          }
          // Do not log token, request headers or the response body.
          if (/\s/.test(token) || /^Bearer\b/i.test(token) || /^["']/.test(token)) {
            console.error('FAIL: Cloudflare API token contains whitespace or an authorization prefix/quote.');
            process.exit(1);
          }
          (async () => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 12000);
            try {
              const response = await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify', {
                method: 'GET',
                headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
                signal: controller.signal
              });
              // Never print raw response or token; only return sanitized PASS/FAIL.
              const payload = await response.json().catch(() => null);
              if (response.ok && payload?.success === true && payload?.result?.status === 'active') {
                console.log('PASS: Cloudflare accepted the GitHub API token (active).');
                const serviceController = new AbortController();
                const serviceTimer = setTimeout(() => serviceController.abort(), 12000);
                try {
                  const service = await fetch('https://api.cloudflare.com/client/v4/accounts/c7c8ad399f1e851d1c3a8be34e66f822/workers/services/autodanini', {
                    method: 'GET',
                    headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
                    signal: serviceController.signal
                  });
                  const body = await service.json().catch(() => null);
                  if (service.ok && body?.success === true) {
                    console.log('PASS: GitHub token can access existing autodanini Worker service (read-only). No deployment performed.');
                  } else {
                    console.error('FAIL: GitHub token cannot access autodanini Worker service (HTTP ' + service.status + '). No deployment performed.');
                    process.exitCode = 1;
                  }
                } finally {
                  clearTimeout(serviceTimer);
                }
              } else {
                console.error('FAIL: Cloudflare API token verification failed (HTTP ' + response.status + '). No deployment performed.');
                process.exitCode = 1;
              }
            } catch {
              console.error('FAIL: Cloudflare token verification request could not complete. No deployment performed.');
              process.exitCode = 1;
            } finally {
              clearTimeout(timer);
            }
          })();
          NODE
