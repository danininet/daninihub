name: DANINI digital payment safety
on:
  pull_request:
    paths:
      - 'digital-commerce.js'
      - 'workers/danini-digital-commerce.mjs'
      - 'workers/danini-intake.mjs'
      - 'autodanini/staging-v12/digital.html'
      - 'autodanini/staging-v12/src/digital-checkout.ts'
      - 'migrations/2026-11-11-danini-digital-d1.sql'
      - 'scripts/prepare-danini-pdf-d1.cjs'
      - 'tests/test-danini-cloudflare-commerce.mjs'
      - 'scripts/test-digital-delivery.js'
      - '.github/workflows/danini-digital-payment-safety.yml'
  push:
    branches: [main]
    paths:
      - 'digital-commerce.js'
      - 'scripts/test-digital-delivery.js'
      - '.github/workflows/danini-digital-payment-safety.yml'
permissions:
  contents: read
jobs:
  digital-payment-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate PayPal order verification and private PDF access (offline test)
        run: npm run test:digital
      - name: Verify Cloudflare commerce is fail-closed and handles PayPal lifecycle offline
        run: node --test tests/test-danini-cloudflare-commerce.mjs
