name: DANINI live brand and safe intake smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/danini-live-brand-intake.yml'
      - 'docs/brand-preview/**'
      - 'scripts/build-autodanini-auto-release.cjs'
      - 'workers/danini-intake.mjs'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify DANINI Cloudflare brand Worker module syntax
        run: node --check workers/danini-brand-overlay.mjs
      - name: Audit all key public site pages and favicon
        run: node scripts/audit-danini-live.mjs
      - name: Check live master brand, existing AutoDanini and protected intake
        run: node scripts/test-current-platform-live.mjs
