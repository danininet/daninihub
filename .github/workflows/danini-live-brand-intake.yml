name: DANINI live brand and safe intake smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/danini-live-brand-intake.yml'
      - 'docs/brand-preview/**'
      - 'scripts/build-autodanini-auto-release.cjs'
      - 'workers/danini-intake.mjs'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify DANINI Cloudflare brand Worker module syntax
        run: node --check workers/danini-brand-overlay.mjs
      - name: Validate PR against isolated static preview build
        if: github.event_name == 'pull_request'
        run: |
          node --check scripts/danini-advisor-pages.cjs
          node scripts/build-danini-ai-preview.cjs
          node --check danini-ai-preview-dist/worker.mjs
          node --check public/danini-advisor-client.js
          node --test tests/b2b/ai-intake.test.mjs tests/b2b/ai-preview.test.mjs
          node --test tests/test-danini-contact-worker.mjs
      - name: Verify isolated Cloudflare PR preview is publicly reachable
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'https://danini-ai-pr207-preview.dragangaganet.workers.dev';
          for (const route of ['/de/ai-savetnik/', '/sr/ai-savetnik/']) {
            const response = await fetch(base + route, {signal: AbortSignal.timeout(18000)});
            assert.equal(response.status, 200, route + ' preview not reachable');
            const html = await response.text();
            assert.equal((html.match(/data-question=/g) || []).length, 3);
            assert.match(html, /id="advisor-cta" class="cta" disabled/);
          }
          const response = await fetch(base + '/api/lead/status', {signal: AbortSignal.timeout(18000)});
          assert.equal(response.status, 200);
          const status = await response.json();
          assert.equal(status.channel, 'preview_no_email');
          assert.equal(status.turnstileSiteKey, '1x00000000000000000000AA');
          console.log('PASS: public PR #207 preview, SR/DE and no-email intake');
          JS
      - name: Audit currently deployed public site (production monitoring only)
        if: github.event_name != 'pull_request'
        run: node scripts/audit-danini-live.mjs
      - name: Check live master brand, existing AutoDanini and protected intake
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const origin='https://daninihub.com';
          async function load(path,opts={}){
            const r=await fetch(origin+path,{redirect:'follow',signal:AbortSignal.timeout(15000),...opts});
            const body=await r.text();return {status:r.status,body,headers:r.headers};
          }
          const [brand,auto,contact,status]=await Promise.all([
            load('/danini.html'),load('/'),load('/contact.html'),load('/api/lead/status')
          ]);
          assert.equal(brand.status,200,'DANINI brand page must be live');
          assert.match(brand.body,/Pitaj AI — AI pita tebe/);
          assert.match(brand.body,/AutoDanini/);
          assert.match(brand.body,/DANINI znak/,'Master brand SVG logo must render');
          assert.match(brand.body,/class="brandlinks"/,'Master brand should have main navigation');
          assert.match(brand.body,/hreflang="sr" href="https:\/\/daninihub.com\/danini-sr.html"/,'SR alternate URL must differ from DE');
          const brandSr=await load('/danini-sr.html');
          assert.equal(brandSr.status,200,'Serbian master-brand landing page');
          assert.match(brandSr.body,/<html lang="sr">/,'Serbian page language');
          assert.match(brandSr.body,/rel="canonical" href="https:\/\/daninihub.com\/danini-sr.html"/,'Unique Serbian canonical');
          assert.equal(auto.status,200,'Existing AutoDanini root preserved');
          assert.match(auto.body,/danini-header/,'Master DANINI navigation visible on the root page');
          assert.match(auto.body,/DACH ↔ BALKAN/,'Current DANINI brand visible on the root page');
          assert.match(auto.body,/AutoDanini/,'AutoDanini remains visible');
          const de=await load('/de/');
          assert.equal(de.status,200,'German landing page must work');
          assert.match(de.body,/danini-header/,'German page needs master navigation');
          const sitemap=await load('/sitemap.xml');
          assert.equal(sitemap.status,200,'Sitemap must load');
          assert.ok(sitemap.body.includes('https://daninihub.com/de/'),'Sitemap includes canonical DE master page');
          assert.ok(sitemap.body.includes('https://daninihub.com/sr/'),'Sitemap includes canonical SR master page');
          assert.match(sitemap.body,/<urlset/,'Sitemap must be valid XML-like sitemap');
          assert.equal(contact.status,200,'Contact page must exist');
          assert.match(contact.body,/<nav class="desktop"/,'Legacy contact navigation remains available');
          const buyers=await load('/buyers.html');
          assert.equal(buyers.status,200,'AutoDanini buyer page reachable');
          assert.match(buyers.body,/<nav class="desktop"/,'Legacy buyer navigation remains available');
          assert.match(buyers.body,/AutoDanini/,'Legacy buyer page identifies AutoDanini');
          const business=await load('/business.html');
          assert.equal(business.status,200,'DANINI Business page reachable');
          assert.match(business.body,/<nav class="desktop"/,'Legacy B2B navigation remains available');
          const robots=await load('/robots.txt');
          assert.equal(robots.status,200,'robots.txt must be public');
          assert.match(robots.body,/Sitemap:\s*https:\/\/daninihub.com\/sitemap.xml/,'Robots must reference canonical sitemap');
          assert.match(contact.body,/mailto:kontakt@daninihub.com/,'Direct business email contact must be visible');
          assert.equal(status.status,200,'Worker status API must exist');
          const data=JSON.parse(status.body);
          assert.equal(typeof data.enabled,'boolean','Intake status must declare readiness');
          assert.equal(status.headers.get('cache-control'),'no-store');
          if(data.enabled){
            assert.ok(data.turnstileSiteKey,'Missing public Turnstile sitekey');
          }
          const rejected=await load('/api/lead',{
            method:'POST',headers:{'content-type':'application/json','Origin':'https://not-danini.invalid'},
            body:JSON.stringify({kind:'general',name:'Internal Test',email:'test@example.invalid',topic:'QA only',message:'Automated negative test, should never be sent',language:'de',consent:true,turnstileToken:'not-a-real-token'})
          });
          assert.ok([403,503].includes(rejected.status),'Wrong-origin input must be rejected before any e-mail');
          console.log('PASS: brand live + AutoDanini safe + contact + intake status:',{brand:brand.status,auto:auto.status,contact:contact.status,enabled:data.enabled,rejected:rejected.status});
          JS
