name: DANINI Brevo production intake safety QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify active production intake and fail-closed security checks
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://daninihub.com';
          const http=async(path,options={})=>{
            const res=await fetch(base+path,{
              ...options,
              redirect:'error',
              signal:AbortSignal.timeout(15000),
              headers:{'accept':'application/json',...options.headers}
            });
            const body=await res.json();
            return {res,body};
          };
          let status;
          // Production Worker deployment can lag behind the GitHub main commit.
          for(let i=0;i<4;i++){
            const r=await http('/api/lead/status',{cache:'no-store'});
            assert.equal(r.res.status,200,'status endpoint must be reachable');
            assert.equal(r.res.headers.get('cache-control'),'no-store');
            status=r.body;
            if(status.enabled===true && status.channel==='brevo')break;
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          assert.equal(status.enabled,true,'DANINI contact intake must be active');
          assert.equal(status.channel,'brevo');
          assert.match(status.turnstileSiteKey,/^0x[A-Za-z0-9_-]{10,}$/,'public Turnstile site key must be present');
          assert.ok(!JSON.stringify(status).includes('BREVO_API_KEY'));
          console.log('PASS: public Brevo channel active and sitekey exposed without secrets');
          const p={
            kind:'vehicle',name:'DANINI QA',email:'no-delivery@example.invalid',
            topic:'Controlled negative security test',
            message:'This is a negative test that must not send an email.',
            consent:true,language:'de',turnstileToken:'invalid-test-proof-20261110'
          };
          const data=JSON.stringify(p);
          const wrongOrigin=await http('/api/lead',{
            method:'POST',
            headers:{'origin':'https://untrusted.example.invalid','content-type':'application/json'},
            body:data
          });
          assert.equal(wrongOrigin.res.status,403);
          assert.equal(wrongOrigin.body.error,'invalid_origin');
          console.log('PASS: forged Origin rejected');
          const noConsent=await http('/api/lead',{
            method:'POST',
            headers:{'origin':base,'content-type':'application/json'},
            body:JSON.stringify({...p,consent:false})
          });
          assert.equal(noConsent.res.status,400);
          assert.equal(noConsent.body.error,'invalid_fields');
          console.log('PASS: missing GDPR consent rejected');
          const noCaptcha=await http('/api/lead',{
            method:'POST',
            headers:{'origin':base,'content-type':'application/json'},
            body:data
          });
          assert.equal(noCaptcha.res.status,400);
          assert.equal(noCaptcha.body.error,'human_verification_failed');
          console.log('PASS: fake Turnstile proof rejected before Brevo send');
          console.log('DANINI production intake safety verified (NO real lead sent).');
          NODE
