name: Danini ImportOS Core

on:
  push:
    branches: [main]
    paths:
      - 'core/importos-*.js'
      - 'daninihub-front/**'
      - 'scripts/test-importos-clean.js'
      - 'server.js'
      - 'server-public-runtime.js'
      - 'server-importos-runtime.js'
      - 'importos-store.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/danini-os-core.yml'
  pull_request:
    paths:
      - 'core/importos-*.js'
      - 'daninihub-front/**'
      - 'scripts/test-importos-clean.js'
      - 'server.js'
      - 'server-public-runtime.js'
      - 'server-importos-runtime.js'
      - 'importos-store.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  importos-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Syntax check
        run: npm run check:syntax
      - name: ImportOS contract
        run: npm run test:importos
      - name: Production frontend build
        run: npm run build
