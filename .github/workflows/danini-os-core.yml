name: DANINI ImportOS Core

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'public/**'
      - 'scripts/test-importos-clean.js'
      - 'scripts/build-hostinger.js'
      - 'scripts/test-site-experience.js'
      - 'server.js'
      - 'server-public-runtime.js'
      - 'site-experience.js'
      - 'server-importos-runtime.js'
      - 'importos-store.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/danini-os-core.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'public/**'
      - 'scripts/test-importos-clean.js'
      - 'scripts/build-hostinger.js'
      - 'scripts/test-site-experience.js'
      - 'server.js'
      - 'server-public-runtime.js'
      - 'site-experience.js'
      - 'server-importos-runtime.js'
      - 'importos-store.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  importos-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:syntax
      - run: npm run test:importos
      - run: npm run build
