name: Danini OS Core

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'scripts/test-agent-execution-contract.js'
      - 'danini.js'
      - 'package.json'
      - '.github/workflows/danini-os-core.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'scripts/test-agent-execution-contract.js'
      - 'danini.js'
      - 'package.json'
      - '.github/workflows/danini-os-core.yml'

permissions:
  contents: read

jobs:
  core-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check:syntax

      - name: Core contract tests
        run: npm run test:core
