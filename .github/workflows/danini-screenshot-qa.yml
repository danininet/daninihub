name: DANINI screenshot visual QA
# Root design QA: capture actual routed 2026-11-12 homepage.
on:
  pull_request:
    paths:
      - '.github/workflows/danini-screenshot-qa.yml'
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Locate screenshot hero text in current site routes
        run: node scripts/find-danini-clutter.mjs
      - name: Inspect exact Business hero and pilot DOM
        run: node scripts/inspect-danini-business-live.mjs
      - name: Verify unfinished auction entries are removed from public navigation
        run: node scripts/check-unfinished-nav.mjs
      - name: Capture production page on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome is not installed on this runner' >&2
            exit 1
          fi
          mkdir -p screenshots
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=4000 --screenshot=screenshots/desktop-sr.png https://daninihub.com/sr/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=4000 --screenshot=screenshots/desktop-de.png https://daninihub.com/de/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=430,900 --virtual-time-budget=4000 --screenshot=screenshots/mobile-sr.png https://daninihub.com/sr/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=430,900 --virtual-time-budget=4000 --screenshot=screenshots/mobile-contact.png 'https://daninihub.com/contact.html?lang=sr'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=430,2200 --virtual-time-budget=4000 --screenshot=screenshots/mobile-sr-long.png https://daninihub.com/sr/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,3200 --virtual-time-budget=4000 --screenshot=screenshots/desktop-sr-long.png https://daninihub.com/sr/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=1440,900 --virtual-time-budget=4000 --screenshot=screenshots/desktop-business.png https://daninihub.com/business
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=430,900 --virtual-time-budget=4000 --screenshot=screenshots/mobile-business.png https://daninihub.com/business
          file screenshots/*.png
      - name: Keep screenshots for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: danini-visual-screenshots
          path: screenshots/*.png
          retention-days: 3
          if-no-files-found: warn
