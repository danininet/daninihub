name: Dispatch Pilot Workspace

on:
  pull_request:
    paths:
      - 'daninihub-front/src/DispatchPilotWorkspace.jsx'
      - 'daninihub-front/src/DispatchPilotWorkspaceV3.jsx'
      - 'daninihub-front/src/DispatchPilotWorkspaceV4.jsx'
      - 'daninihub-front/src/DispatchPilotWorkspaceV5.jsx'
      - 'daninihub-front/src/DispatchPilotWorkspace.css'
      - 'daninihub-front/src/DispatchPilotWorkspaceV2.css'
      - 'daninihub-front/src/DispatchPilotWorkspaceV4.css'
      - 'daninihub-front/src/DispatchPilotWorkspaceV5.css'
      - 'daninihub-front/src/App.jsx'
      - 'core/dispatch-ai-structure.js'
      - 'server-dispatch-runtime.js'
      - 'dispatch-access-bootstrap.js'
      - 'dispatch-case-store.js'
      - 'server.js'
      - 'scripts/test-dispatch-workspace-contract.js'
      - 'scripts/test-dispatch-secure-runtime.js'
      - 'scripts/test-dispatch-ai-structure.js'
      - 'scripts/test-dispatch-access-bootstrap.js'
      - 'package.json'
      - '.github/workflows/dispatch-pilot-workspace.yml'

permissions:
  contents: read

jobs:
  dispatch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check:syntax

      - name: Core contract
        run: npm run test:core

      - name: Guided analysis contract
        run: npm run test:guided

      - name: Gumroad contract
        run: npm run test:gumroad

      - name: Admin contract
        run: npm run test:admin

      - name: Public site contracts
        run: npm run test:public

      - name: Dispatch UI contract
        run: npm run test:dispatch

      - name: Dispatch secure runtime contract
        run: npm run test:dispatch-secure

      - name: Dispatch AI structuring contract
        run: npm run test:dispatch-ai

      - name: Dispatch signed access contract
        run: npm run test:dispatch-access

      - name: Production frontend build
        run: npm run build
