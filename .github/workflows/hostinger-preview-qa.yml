name: Hostinger isolated preview QA
on:
  push:
    branches: [hostinger/platform-preview-20261124, hostinger/audit-fixes-20261124]
  pull_request:
    branches: [hostinger/audit-fixes-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/hostinger/platform-preview-20261124' || github.ref == 'refs/heads/hostinger/audit-fixes-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-hostinger-desktop-visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hostinger-desktop-screenshots
          path: artifacts/hostinger-desktop/
      - run: node --check hostinger-preview.cjs
      - run: npm run test:hostinger-preview
      - run: node --test tests/hostinger-audit.test.cjs
      - run: npm run build:hostinger-production
      - run: node --test tests/hostinger-production-build.test.cjs
      - run: node --test tests/b2b/hostinger-frontend.test.mjs
