name: DaniniHub Public Site

on:
  push:
    branches: [main]
    paths:
      - 'daninihub-front/**'
      - 'server-public-runtime.js'
      - 'scripts/test-public-content-contract.js'
      - 'scripts/test-pilot-policy-contract.js'
      - 'scripts/test-contact-lead-store.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/public-site.yml'
  pull_request:
    paths:
      - 'daninihub-front/**'
      - 'server-public-runtime.js'
      - 'scripts/test-public-content-contract.js'
      - 'scripts/test-pilot-policy-contract.js'
      - 'scripts/test-contact-lead-store.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/public-site.yml'

permissions:
  contents: read

jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check:syntax

      - name: Public contract tests
        run: npm run test:public

      - name: Production frontend build
        run: npm run build
