name: Refresh patched dependency lock

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/refresh-body-parser-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify package manifests are synchronized
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify patched body-parser
        run: npm ls body-parser

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile with body-parser 2.3.0"
          git push
