name: DaniniHub Runtime Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - ustav-runtime-core

jobs:
  runtime-check:
    name: Express runtime validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate server syntax
        run: npm run build

      - name: Validate Hostinger build command
        run: npm run build:front

      - name: Validate runtime check script
        run: npm run check:runtime
